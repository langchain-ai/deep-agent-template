[project]
name = "deep-agent-template"
version = "0.1.0"
description = "Deep Agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.8",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-sdk>=0.4.3",
    "langsmith>=0.11.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.uv.build-backend]
module-name = "deep_agent"
source-include = ["langgraph.json", ".env.example", "Makefile"]
